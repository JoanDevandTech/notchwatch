name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (por ejemplo v0.2.0 o v0.2.0-beta.1)"
        required: true
      ref:
        description: "Rama o commit a compilar; el tag se crea sobre él si no existe"
        required: false
        default: main

permissions:
  contents: write

jobs:
  release:
    name: DMG y GitHub Release
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | tail -1)"
          xcodebuild -version

      # CFBundleVersion tiene que crecer en cada release para que Sparkle vea la nueva versión.
      # Se deriva del número de ejecución del workflow (monótono): 100 + run_number, siempre
      # por encima del CURRENT_PROJECT_VERSION del proyecto (25) que llevan las builds locales.
      - name: Número de build
        run: |
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "CFBundleVersion: $BUILD_NUMBER · versión: ${TAG#v}"

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild build \
            -project DynamicNotch.xcodeproj -scheme DynamicNotch -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO \
            MARKETING_VERSION="${TAG#v}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | grep -E "error:|BUILD|\*\*" || true
          APP="build/DerivedData/Build/Products/Release/Notchwatch.app"
          test -d "$APP"
          BUILT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          echo "CFBundleVersion compilado: $BUILT_VERSION"
          test "$BUILT_VERSION" = "$BUILD_NUMBER"

      # Con los secretos MACOS_CERT_P12_BASE64 y MACOS_CERT_PASSWORD se firma con el certificado
      # propio «Notchwatch Self-Signed» (identidad estable: el permiso del Llavero sobrevive a las
      # actualizaciones). Sin ellos se mantiene la firma ad-hoc.
      - name: Preparar la identidad de firma
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12_BASE64:-}" ]]; then
            echo "Sin MACOS_CERT_P12_BASE64: firma ad-hoc."
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KC="$RUNNER_TEMP/notchwatch-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$KC_PASS"
          P12="$RUNNER_TEMP/notchwatch-signing.p12"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          EXISTING="$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KC" $EXISTING
          security find-identity -p codesigning "$KC"
          security find-certificate -c "Notchwatch Self-Signed" "$KC" > /dev/null
          echo "SIGN_IDENTITY=Notchwatch Self-Signed" >> "$GITHUB_ENV"

      - name: Firmar la app
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release/Notchwatch.app"
          echo "Identidad: $SIGN_IDENTITY"
          if [[ -n "${SIGN_KEYCHAIN:-}" ]]; then
            codesign --force --deep --sign "$SIGN_IDENTITY" --keychain "$SIGN_KEYCHAIN" "$APP"
          else
            codesign --force --deep --sign "$SIGN_IDENTITY" "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "^(Identifier|Authority|Signature|TeamIdentifier)" || true
          codesign -dr - "$APP"

      - name: DMG
        run: |
          APP="build/DerivedData/Build/Products/Release/Notchwatch.app"
          codesign --verify --deep --strict "$APP"
          STAGING="$(mktemp -d)"
          ditto "$APP" "$STAGING/Notchwatch.app"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p build/dmg
          hdiutil create -volname Notchwatch -srcfolder "$STAGING" -ov -format UDZO "build/dmg/Notchwatch-${TAG#v}.dmg"
          (cd build/dmg && shasum -a 256 "Notchwatch-${TAG#v}.dmg" > "Notchwatch-${TAG#v}.dmg.sha256")

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" build/dmg/*.dmg build/dmg/*.sha256 \
            --target "$(git rev-parse HEAD)" \
            --title "Notchwatch $TAG" --generate-notes $PRERELEASE

      # Con el secreto SPARKLE_PRIVATE_KEY (semilla Ed25519 en base64, la pareja de la
      # SUPublicEDKey del Info.plist) se firma el DMG con sign_update y se añade la versión al
      # appcast.xml de main, que es el feed que consultan las apps instaladas. Sin el secreto,
      # la release se publica igual pero el appcast no se toca. Sin canales: todas las versiones
      # (también las -beta) van al feed principal.
      - name: Firmar para Sparkle y actualizar el appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "Sin SPARKLE_PRIVATE_KEY: no se firma para Sparkle ni se actualiza el appcast."
            exit 0
          fi
          APP="build/DerivedData/Build/Products/Release/Notchwatch.app"
          DMG_NAME="Notchwatch-${TAG#v}.dmg"
          DMG="$PWD/build/dmg/$DMG_NAME"
          SCRIPTS="$PWD/.github/scripts"

          SPARKLE_VERSION="$(python3 -c 'import json, sys; pins = json.load(open(sys.argv[1]))["pins"]; print(next(p["state"]["version"] for p in pins if p["identity"] == "sparkle"))' \
            DynamicNotch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)"
          echo "Herramientas de Sparkle $SPARKLE_VERSION"
          TOOLS="$RUNNER_TEMP/sparkle-tools"
          mkdir -p "$TOOLS"
          curl -fsSL --retry 3 \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJ -C "$TOOLS"

          KEY_FILE="$RUNNER_TEMP/sparkle_ed25519.key"
          trap 'rm -f "$KEY_FILE"' EXIT
          (umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE")
          SIGN_OUTPUT="$("$TOOLS/bin/sign_update" --ed-key-file "$KEY_FILE" "$DMG")"
          rm -f "$KEY_FILE"
          ED_SIGNATURE="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<< "$SIGN_OUTPUT")"
          LENGTH="$(sed -n 's/.*length="\([0-9]*\)".*/\1/p' <<< "$SIGN_OUTPUT")"
          test -n "$ED_SIGNATURE"
          test "$LENGTH" = "$(stat -f%z "$DMG")"

          # La firma tiene que validar con la clave pública que lleva la app; si no, las apps
          # instaladas rechazarían la actualización.
          PUBLIC_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP/Contents/Info.plist")"
          swift "$SCRIPTS/verify_ed_signature.swift" "$PUBLIC_KEY" "$ED_SIGNATURE" "$DMG"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORKTREE="$RUNNER_TEMP/appcast-main"
          for attempt in 1 2 3; do
            # Cada intento parte del main más reciente y regenera el item (equivale a pull --rebase
            # sin conflictos posibles en el XML).
            rm -rf "$WORKTREE"
            git worktree prune
            git fetch --depth=1 origin main
            git worktree add --detach "$WORKTREE" FETCH_HEAD
            python3 "$SCRIPTS/update_appcast.py" \
              --appcast "$WORKTREE/appcast.xml" \
              --tag "$TAG" \
              --build "$BUILD_NUMBER" \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DMG_NAME}" \
              --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
              --signature "$ED_SIGNATURE" \
              --length "$LENGTH" \
              --min-system 14.6
            git -C "$WORKTREE" add appcast.xml
            git -C "$WORKTREE" commit -m "chore(appcast): Notchwatch ${TAG#v} (build $BUILD_NUMBER)"
            if git -C "$WORKTREE" push origin HEAD:main; then
              echo "appcast.xml actualizado en main."
              exit 0
            fi
            echo "Push rechazado (main avanzó); reintento $attempt…"
            sleep 5
          done
          echo "::error::No se pudo subir appcast.xml a main."
          exit 1

      - name: Borrar el llavero temporal
        if: always()
        run: |
          KC="$RUNNER_TEMP/notchwatch-signing.keychain-db"
          if [[ -f "$KC" ]]; then
            security delete-keychain "$KC" || true
          fi
          rm -f "$RUNNER_TEMP/notchwatch-signing.p12"
